<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Menna - Pastel Edition</title>
    <!-- أرقى وأفخم خطوط جوجل العالمية -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            /* خلفية فاتحة ومبهجة بدرجات الباستيل والروز الهادئ */
            background: radial-gradient(circle at center, #fff5f8 0%, #ffe6f0 100%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
        }

        /* خلفية القلوب والنجوم المتحركة (بألوان واضحة وفاتحة) */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* هالة إضاءة خلفية ناعمة ومضيئة */
        .ambient-glow {
            position: absolute;
            width: 75vw;
            height: 75vw;
            max-width: 550px;
            max-height: 550px;
            background: radial-gradient(circle, rgba(255, 182, 193, 0.45) 0%, rgba(255, 223, 186, 0.25) 50%, rgba(255, 255, 255, 0) 75%);
            border-radius: 50%;
            z-index: 2;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 7s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
            100% { transform: translate(-50%, -50%) scale(1.35); opacity: 1; }
        }

        /* --- زر تشغيل الموسيقى (دائرة أنيقة ومضيئة أسفل اليسار) --- */
        #musicToggleBtn {
            position: fixed;
            bottom: 25px;
            left: 25px;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(255, 182, 193, 0.8);
            color: #c72c5c;
            font-size: 1.4rem;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 50;
            box-shadow: 0 10px 25px rgba(199, 44, 92, 0.25);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            animation: pulseBtn 2s infinite ease-in-out;
        }

        @keyframes pulseBtn {
            0% { box-shadow: 0 0 0 0 rgba(255, 75, 114, 0.4); }
            70% { box-shadow: 0 0 0 15px rgba(255, 75, 114, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 75, 114, 0); }
        }

        #musicToggleBtn:hover {
            transform: scale(1.1);
            background: #ff4b72;
            color: #fff;
            border-color: #ff4b72;
        }

        #musicToggleBtn.playing {
            background: #ff4b72;
            color: #fff;
            border-color: #ff4b72;
            animation: none;
        }

        /* --- شاشة الـ Intro السينمائية (كتابة حرف حرف) --- */
        #introScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            background: radial-gradient(circle at center, #fff0f5 0%, #ffe0ec 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 24px;
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .intro-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.4rem, 4.8vw, 2.6rem);
            font-weight: 700;
            color: #d84373;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(216, 67, 115, 0.2);
            margin-bottom: 25px;
            min-height: 1.5em;
        }

        .surprise-box-wrapper {
            position: relative;
            padding: 2.5px;
            border-radius: 24px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            width: 90%;
            max-width: 360px;
            box-shadow: 0 15px 35px rgba(216, 67, 115, 0.15);
        }

        .surprise-box-wrapper.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .surprise-box-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 182, 193, 0.3), #ff9ebb, #ffb6c1, #ffd700, transparent 65%);
            animation: rotateGlow 4.5s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .surprise-box-content {
            position: relative;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 20px 28px;
            border-radius: 22px;
            z-index: 2;
            text-align: center;
        }

        .surprise-box-content p {
            font-size: clamp(0.95rem, 3.2vw, 1.15rem);
            color: #c72c5c;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        /* --- الصفحة الرئيسية --- */
        .main-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            padding: 4vh 0;
        }

        .main-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        .top-header {
            width: 100%;
            text-align: center;
        }

        .top-header h2 {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 700;
            color: #c72c5c;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(199, 44, 92, 0.15);
            margin-bottom: 2px;
        }

        .top-header span {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.2rem, 3.8vw, 2rem);
            color: #e0568c;
            text-shadow: 0 0 10px rgba(224, 86, 140, 0.2);
            display: block;
        }

        /* --- مربع اسم منة مع إضاءة متحركة تلف حوله --- */
        .name-box-wrapper {
            position: relative;
            padding: 3px;
            border-radius: 24px;
            overflow: hidden;
            width: 82%;
            max-width: 320px;
            margin: 1vh 0;
            box-shadow: 0 15px 35px rgba(216, 67, 115, 0.15);
            animation: floatBox 3.5s ease-in-out infinite alternate;
        }

        @keyframes floatBox {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-5px); }
        }

        .name-box-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 182, 193, 0.3), #ff9ebb, #ffb6c1, #ffd700, transparent 65%);
            animation: rotateGlow 4.5s linear infinite;
        }

        .name-box-content {
            position: relative;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px;
            border-radius: 22px;
            z-index: 2;
            text-align: center;
        }

        .name-box-content h3 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 6vw, 2.8rem);
            color: #c72c5c;
            text-shadow: 0 0 15px rgba(199, 44, 92, 0.2);
            letter-spacing: 2px;
        }

        /* الكارد الزجاجي الرئيسي للباسورد */
        .glass-card {
            width: 88%;
            max-width: 380px;
            padding: 32px 26px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 182, 193, 0.5);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(199, 44, 92, 0.12), 
                        inset 0 1px 0 rgba(255, 255, 255, 1);
            text-align: center;
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            color: #881437;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }

        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 20px;
            background: rgba(255, 240, 245, 0.6);
            border: 1px solid rgba(255, 182, 193, 0.7);
            border-radius: 40px;
            color: #4a0e1c;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 3px;
        }

        input[type="password"]:focus {
            border-color: #c72c5c;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 20px rgba(199, 44, 92, 0.2);
        }

        input::placeholder {
            color: rgba(199, 44, 92, 0.45);
            font-weight: 300;
            letter-spacing: normal;
        }

        button {
            width: 100%;
            background: linear-gradient(135deg, #ff758c 0%, #ff4b72 100%);
            border: none;
            color: #fff;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 75, 114, 0.35);
            letter-spacing: 1.5px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 75, 114, 0.5);
        }

        button:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #d63031;
            font-size: 0.82rem;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-msg.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <canvas id="heartsCanvas"></canvas>

    <!-- زرار التشغيل الدائري الشيك أسفل اليسار -->
    <button id="musicToggleBtn" onclick="toggleMusic()">🎵</button>

    <!-- عنصر الصوت المباشر (يشتغل بسلاسة تامة وبدون إعلانات) -->
    <audio id="bgAudio" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-tenderness.mp3" type="audio/mp3">
    </audio>

    <!-- شاشة الـ Intro السينمائية: كتابة حرف حرف -->
    <div id="introScreen">
        <div class="intro-title" id="introTitle"></div>
        <div class="surprise-box-wrapper" id="surpriseBox">
            <div class="surprise-box-content">
                <p>Let's get to the surprise! ✨</p>
            </div>
        </div>
    </div>

    <!-- الصفحة الرئيسية -->
    <div class="main-container" id="mainContainer">
        <div class="top-header">
            <h2>Birthday Menna</h2>
            <span>Special Day For You ✨</span>
        </div>

        <!-- مربع الاسم مع إضاءة متحركة تلف حوله -->
        <div class="name-box-wrapper">
            <div class="name-box-content">
                <h3>Menna</h3>
            </div>
        </div>

        <div class="glass-card">
            <div class="card-title">Enter Password</div>
            <div class="input-box">
                <input type="password" id="passCode" placeholder="Enter Password" autocomplete="off">
            </div>
            <button onclick="verifyPassword()">Open Surprise</button>
            <div id="errorText" class="error-msg">Incorrect password, try again</div>
        </div>
    </div>

    <script>
        // دالة تشغيل وإيقاف الصوت عبر الدائرة السفلية
        const audio = document.getElementById('bgAudio');
        const musicBtn = document.getElementById('musicToggleBtn');
        let isPlaying = false;

        function toggleMusic() {
            if (!isPlaying) {
                audio.play().then(() => {
                    isPlaying = true;
                    musicBtn.innerHTML = "⏸";
                    musicBtn.classList.add('playing');
                }).catch(err => {
                    console.log("Audio play blocked", err);
                });
            } else {
                audio.pause();
                isPlaying = false;
                musicBtn.innerHTML = "🎵";
                musicBtn.classList.remove('playing');
            }
        }

        // تأثير كتابة HAPPY BIRTHDAY MENNA حرف حرف
        const textToType = "HAPPY BIRTHDAY MENNA";
        let charIndex = 0;
        const typingSpeed = 70;

        function typeWriter() {
            if (charIndex < textToType.length) {
                document.getElementById('introTitle').innerHTML += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, typingSpeed);
            } else {
                setTimeout(() => {
                    document.getElementById('surpriseBox').classList.add('show');
                }, 400);

                setTimeout(() => {
                    const intro = document.getElementById('introScreen');
                    intro.style.opacity = '0';
                    setTimeout(() => {
                        intro.style.display = 'none';
                        document.getElementById('mainContainer').classList.add('active');
                    }, 1400);
                }, 4200);
            }
        }

        window.onload = () => {
            setTimeout(typeWriter, 500);
        };

        // تأثير القلوب والنجوم المتحركة عبر الـ Canvas
        const canvas = document.getElementById('heartsCanvas');
        const ctx = canvas.getContext('2d');

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        initCanvas();
        window.addEventListener('resize', initCanvas);

        const hearts = [];
        class FloatingHeart {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + 50;
                this.size = Math.random() * 12 + 6;
                this.speedY = Math.random() * 0.7 + 0.3;
                this.speedX = (Math.random() - 0.5) * 0.4;
                this.opacity = Math.random() * 0.5 + 0.3;
                this.angle = Math.random() * Math.PI * 2;
                this.spin = (Math.random() - 0.5) * 0.015;
            }
            update() {
                this.y -= this.speedY;
                this.x += this.speedX;
                this.angle += this.spin;
                if (this.y < -40) {
                    this.reset();
                }
            }
            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = '#ff4b72';
                
                ctx.beginPath();
                let d = this.size;
                ctx.moveTo(0, d / 4);
                ctx.bezierCurveTo(0, 0, -d / 2, 0, -d / 2, d / 4);
                ctx.bezierCurveTo(-d / 2, d / 2, 0, d * 0.75, 0, d);
                ctx.bezierCurveTo(0, d * 0.75, d / 2, d / 2, d / 2, d / 4);
                ctx.bezierCurveTo(d / 2, 0, 0, 0, 0, d / 4);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 35; i++) {
            hearts.push(new FloatingHeart());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach(h => {
                h.update();
                h.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        // التحقق من الباسورد 2492008 وإيقاف الصوت والدائرة فوراً
        function verifyPassword() {
            const pass = document.getElementById('passCode').value;
            const errorText = document.getElementById('errorText');
            
            if (pass === "2492008") {
                // إيقاف الصوت وإزالة الدائرة فوراً
                audio.pause();
                if (musicBtn) musicBtn.remove();

                document.querySelector('.glass-card').style.transform = "scale(1.04)";
                document.querySelector('.glass-card').style.opacity = "0";
                document.querySelector('.top-header').style.opacity = "0";
                document.querySelector('.name-box-wrapper').style.opacity = "0";
                setTimeout(() => {
                    alert("Welcome Menna ✨ Your Special Surprise Unlocked!");
                }, 400);
            } else {
                errorText.classList.add('show');
                const card = document.querySelector('.glass-card');
                card.style.transform = "translateX(10px)";
                setTimeout(() => card.style.transform = "translateX(-10px)", 90);
                setTimeout(() => card.style.transform = "translateX(0)", 180);
            }
        }
    </script>
</body>
</html>
