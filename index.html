<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Birthday Menna - Magical Edition</title>
    <!-- خطوط جوجل المتناسقة -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Great+Vibes&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at center, #1a0013 0%, #0d0009 100%);
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: fixed;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- شاشة الـ Intro السينمائية --- */
        #introScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 30;
            background: radial-gradient(circle at center, #25001a 0%, #0d0009 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 24px;
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .intro-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.4rem, 4.8vw, 2.6rem);
            font-weight: 700;
            color: #ff8fa3;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 143, 163, 0.4);
            margin-bottom: 25px;
            min-height: 1.5em;
        }

        .surprise-box-wrapper {
            position: relative;
            padding: 2.5px;
            border-radius: 24px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(20px) scale(0.95);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            width: 90%;
            max-width: 360px;
            box-shadow: 0 15px 35px rgba(255, 75, 114, 0.2);
        }

        .surprise-box-wrapper.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .surprise-box-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 182, 193, 0.3), #ff4b72, #ffd700, transparent 65%);
            animation: rotateGlow 4.5s linear infinite;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .surprise-box-content {
            position: relative;
            background: rgba(20, 0, 12, 0.85);
            backdrop-filter: blur(20px);
            padding: 20px 28px;
            border-radius: 22px;
            z-index: 2;
            text-align: center;
        }

        .surprise-box-content p {
            font-size: clamp(0.95rem, 3.2vw, 1.15rem);
            color: #ffb3c6;
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        /* --- الصفحة الرئيسية وقسم الباسورد --- */
        .main-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            padding: 4vh 0;
        }

        .main-container.active {
            opacity: 1;
            pointer-events: auto;
        }

        .top-header {
            width: 100%;
            text-align: center;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        .top-header h2 {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            font-weight: 700;
            color: #ff8fa3;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255, 143, 163, 0.4);
            margin-bottom: 2px;
        }

        .top-header span {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.2rem, 3.8vw, 2rem);
            color: #ffb3c6;
            text-shadow: 0 0 10px rgba(255, 179, 198, 0.4);
            display: block;
        }

        .name-box-wrapper {
            position: relative;
            padding: 3px;
            border-radius: 24px;
            overflow: hidden;
            width: 82%;
            max-width: 320px;
            margin: 1vh 0;
            box-shadow: 0 15px 35px rgba(255, 75, 114, 0.2);
            animation: floatBox 3.5s ease-in-out infinite alternate;
            z-index: 10;
            transition: opacity 0.5s ease;
        }

        @keyframes floatBox {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-5px); }
        }

        .name-box-wrapper::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg, transparent, rgba(255, 182, 193, 0.3), #ff4b72, #ffd700, transparent 65%);
            animation: rotateGlow 4.5s linear infinite;
        }

        .name-box-content {
            position: relative;
            background: rgba(20, 0, 12, 0.85);
            backdrop-filter: blur(20px);
            padding: 16px 20px;
            border-radius: 22px;
            z-index: 2;
            text-align: center;
        }

        .name-box-content h3 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2rem, 6vw, 2.8rem);
            color: #ffb3c6;
            text-shadow: 0 0 15px rgba(255, 179, 198, 0.4);
            letter-spacing: 2px;
        }

        .glass-card {
            width: 88%;
            max-width: 380px;
            padding: 32px 26px;
            background: rgba(25, 0, 15, 0.75);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 143, 163, 0.3);
            border-radius: 28px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            z-index: 10;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card-title {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            color: #ff8fa3;
            margin-bottom: 18px;
            letter-spacing: 2px;
        }

        .input-box {
            position: relative;
            margin-bottom: 18px;
        }

        input[type="password"] {
            width: 100%;
            padding: 14px 20px;
            background: rgba(40, 0, 25, 0.6);
            border: 1px solid rgba(255, 143, 163, 0.4);
            border-radius: 40px;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
            letter-spacing: 3px;
        }

        input[type="password"]:focus {
            border-color: #ff4b72;
            background: rgba(50, 0, 30, 0.9);
            box-shadow: 0 0 20px rgba(255, 75, 114, 0.4);
        }

        input::placeholder {
            color: rgba(255, 143, 163, 0.4);
            font-weight: 300;
            letter-spacing: normal;
        }

        button.action-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff758c 0%, #ff4b72 100%);
            border: none;
            color: #fff;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px rgba(255, 75, 114, 0.35);
            letter-spacing: 1.5px;
        }

        button.action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(255, 75, 114, 0.6);
        }

        .error-msg {
            color: #ff6b6b;
            font-size: 0.825rem;
            margin-top: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .error-msg.show {
            opacity: 1;
        }

        /* --- اسم منة الفخم في السما --- */
        #skyNameBanner {
            position: absolute;
            top: 7%;
            width: 100%;
            text-align: center;
            z-index: 25;
            opacity: 0;
            transform: scale(0.5) translateY(-30px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #skyNameBanner.show {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        #skyNameBanner h1 {
            font-family: 'Great Vibes', cursive;
            font-size: clamp(2.8rem, 9vw, 5rem);
            background: linear-gradient(135deg, #ff99bb 0%, #ff4b72 50%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 35px rgba(255, 75, 114, 0.6);
            letter-spacing: 3px;
        }

        #skyNameBanner p {
            font-family: 'Cinzel', serif;
            color: #ffe3e6;
            font-size: clamp(0.8rem, 2.5vw, 1rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: -5px;
            text-shadow: 0 0 15px rgba(255, 143, 163, 0.8);
        }

        /* --- حاوية الجمل (مرتبة تحت بعضها بشكل شيك في الموبايل) --- */
        #messagesWrapper {
            position: absolute;
            bottom: 4vh;
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 25;
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #messagesWrapper.show {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .message-line-card {
            background: rgba(25, 0, 15, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 143, 163, 0.4);
            border-radius: 16px;
            padding: 11px 16px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5), 0 0 15px rgba(255, 75, 114, 0.15);
            opacity: 0;
            transform: translateY(12px) scale(0.96);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .message-line-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .message-text {
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            color: #ffe3e6;
            font-size: clamp(0.9rem, 3vw, 1.1rem);
            line-height: 1.5;
            text-shadow: 0 0 10px rgba(255, 143, 163, 0.4);
            direction: rtl;
        }

        /* ستايل النص الإنجليزي بلون ذهبي لامع ومميز */
        .eng-text {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            direction: ltr;
            display: inline-block;
        }
    </style>
</head>
<body>

    <canvas id="fireworksCanvas"></canvas>

    <!-- شاشة الـ Intro السينمائية -->
    <div id="introScreen">
        <div class="intro-title" id="introTitle"></div>
        <div class="surprise-box-wrapper" id="surpriseBox">
            <div class="surprise-box-content">
                <p>Let's get to the surprise! ✨</p>
            </div>
        </div>
    </div>

    <!-- الصفحة الرئيسية وباسورد الدخول -->
    <div class="main-container" id="mainContainer">
        <div class="top-header" id="topHeader">
            <h2>Birthday Menna</h2>
            <span>Special Day For You ✨</span>
        </div>

        <div class="name-box-wrapper" id="nameBoxWrapper">
            <div class="name-box-content">
                <h3>Menna</h3>
            </div>
        </div>

        <div class="glass-card" id="loginCard">
            <div class="card-title">Enter Password</div>
            <div class="input-box">
                <input type="password" id="passCode" placeholder="Enter Password" autocomplete="off">
            </div>
            <button class="action-btn" onclick="verifyPassword()">Open Surprise</button>
            <div id="errorText" class="error-msg">Incorrect password, try again</div>
        </div>
    </div>

    <!-- اسم منة الفخم في السما -->
    <div id="skyNameBanner">
        <h1>Menna</h1>
        <p>Happy Birthday To You ✨</p>
    </div>

    <!-- حاوية الجمل -->
    <div id="messagesWrapper"></div>

    <script>
        // تأثير الكتابة في الـ Intro
        const textToType = "HAPPY BIRTHDAY MENNA";
        let charIndex = 0;

        function typeWriterIntro() {
            if (charIndex < textToType.length) {
                document.getElementById('introTitle').innerHTML += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriterIntro, 70);
            } else {
                setTimeout(() => {
                    document.getElementById('surpriseBox').classList.add('show');
                }, 400);

                setTimeout(() => {
                    const intro = document.getElementById('introScreen');
                    intro.style.opacity = '0';
                    setTimeout(() => {
                        intro.style.display = 'none';
                        document.getElementById('mainContainer').classList.add('active');
                    }, 1400);
                }, 4200);
            }
        }

        window.onload = () => {
            setTimeout(typeWriterIntro, 500);
        };

        // --- محرك الألعاب النارية ---
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        initCanvas();
        window.addEventListener('resize', initCanvas);

        let fireworksEnabled = false;
        const particles = [];
        const fireworks = [];

        class Firework {
            constructor(x, y, targetX, targetY) {
                this.x = x;
                this.y = y;
                this.targetX = targetX;
                this.targetY = targetY;
                this.coordinates = [];
                this.angle = Math.atan2(targetY - y, targetX - x);
                this.speed = 5;
                this.accel = 1.05;
                this.brightness = Math.random() * 50 + 50;
                this.hue = Math.random() * 60 + 320; 
            }
            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.accel;
                let vx = Math.cos(this.angle) * this.speed;
                let vy = Math.sin(this.angle) * this.speed;
                
                if (Math.hypot(this.targetX - this.x, this.targetY - this.y) < this.speed) {
                    createParticles(this.targetX, this.targetY, this.hue);
                    fireworks.splice(index, 1);
                } else {
                    this.x += vx;
                    this.y += vy;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsl(${this.hue}, 100%, ${this.brightness}%)`;
                ctx.stroke();
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.coordinates = [];
                for (let i = 0; i < 5; i++) {
                    this.coordinates.push([this.x, this.y]);
                }
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 10 + 2;
                this.friction = 0.95;
                this.gravity = 1;
                this.hue = hue;
                this.brightness = Math.random() * 50 + 50;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015;
            }
            update(index) {
                this.coordinates.pop();
                this.coordinates.unshift([this.x, this.y]);
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
                if (this.alpha <= this.decay) {
                    particles.splice(index, 1);
                }
            }
            draw() {
                ctx.beginPath();
                ctx.moveTo(this.coordinates[this.coordinates.length - 1][0], this.coordinates[this.coordinates.length - 1][1]);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 100%, ${this.brightness}%, ${this.alpha})`;
                ctx.stroke();
            }
        }

        function createParticles(x, y, hue) {
            let particleCount = 40;
            while (particleCount--) {
                particles.push(new Particle(x, y, hue));
            }
        }

        let timer = 0;
        function animateFireworks() {
            requestAnimationFrame(animateFireworks);
            ctx.fillStyle = 'rgba(13, 0, 9, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let i = fireworks.length;
            while (i--) {
                fireworks[i].update(i);
                fireworks[i].draw();
            }

            let j = particles.length;
            while (j--) {
                particles[j].update(j);
                particles.draw ? particles[j].draw() : null; // حماية ضد الأخطاء
            }

            if (fireworksEnabled && timer++ % 35 === 0) {
                let startX = canvas.width / 2;
                let startY = canvas.height;
                let targetX = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
                let targetY = Math.random() * canvas.height * 0.45;
                fireworks.push(new Firework(startX, startY, targetX, targetY));
            }
        }
        animateFireworks();

        // الجمل المطلوبة
        const messageLines = [
            "<span class='eng-text'>Happy Birthday Menna ❤️</span>",
            "كل سنه وانتي طيبه يا احلي من تم 19 ❤️",
            "ربنا يديمك ف حياتي يا منه ❤️",
            "اتمني تكوني فرحتي بالحاجه الصغيره دي ❤️",
            "<span class='eng-text'>Menna 1️⃣9️⃣ ✨</span>"
        ];

        let msgIndex = 0;

        // دالة الكتابة حرف حرف داخل الكروت المرتبة تحت بعضها
        function displayNextMessageLine() {
            if (msgIndex >= messageLines.length) return;

            const wrapper = document.getElementById('messagesWrapper');
            
            // إنشاء كارت جديد لكل جملة
            const card = document.createElement('div');
            card.className = 'message-line-card';
            
            const textDiv = document.createElement('div');
            textDiv.className = 'message-text';
            card.appendChild(textDiv);
            wrapper.appendChild(card);

            // إظهار الكارت بحركة انسيابية
            setTimeout(() => {
                card.classList.add('visible');
            }, 50);

            // تجهيز النص وإزالة الـ HTML tags مؤقتاً لحساب الحروف وتأثير الـ Typewriter
            const fullHtml = messageLines[msgIndex];
            
            // لو الجملة فيها span إنجليزي بنعاملها ككتلة واحدة أو بنكتبها بشكل ذكي
            if (fullHtml.includes('eng-text')) {
                // عرض النص الإنجليزي المميز مباشرة بشكل احترافي
                let currentText = "";
                let htmlChars = fullHtml;
                let charCounter = 0;
                
                function typeHtml() {
                    if (charCounter <= htmlChars.length) {
                        textDiv.innerHTML = htmlChars.substring(0, charCounter);
                        charCounter += 2; // سرعة مناسبة للنص الجاهز
                        setTimeout(typeHtml, 35);
                    } else {
                        textDiv.innerHTML = htmlChars;
                        msgIndex++;
                        setTimeout(displayNextMessageLine, 800);
                    }
                }
                setTimeout(typeHtml, 200);

            } else {
                // كتابة الجمل العربية حرف بحرف (Typewriter Effect)
                let charPos = 0;
                function typeArabic() {
                    if (charPos <= fullHtml.length) {
                        textDiv.innerHTML = fullHtml.substring(0, charPos);
                        charPos++;
                        setTimeout(typeArabic, 45); // سرعة كتابة الحروف العربية
                    } else {
                        msgIndex++;
                        setTimeout(displayNextMessageLine, 800); // الانتقال للجملة اللي بعدها
                    }
                }
                setTimeout(typeArabic, 200);
            }
        }

        // التحقق من الباسورد (2492007)
        function verifyPassword() {
            const pass = document.exit ? "" : document.getElementById('passCode').value;
            const errorText = document.getElementById('errorText');
            
            if (pass === "2492007") {
                fireworksEnabled = true;

                const loginCard = document.getElementById('loginCard');
                loginCard.style.transform = "scale(0.8)";
                loginCard.style.opacity = "0";
                loginCard.style.pointerEvents = "none";
                
                document.getElementById('topHeader').style.opacity = "0";
                document.getElementById('nameBoxWrapper').style.opacity = "0";

                setTimeout(() => {
                    document.getElementById('skyNameBanner').classList.add('show');
                    document.getElementById('messagesWrapper').classList.add('show');
                    displayNextMessageLine(); // بدء عرض الكروت حرف حرف تحت بعضها
                }, 500);

            } else {
                errorText.classList.add('show');
                const card = document.getElementById('loginCard');
                card.style.transform = "translateX(10px)";
                setTimeout(() => card.style.transform = "translateX(-10px)", 90);
                setTimeout(() => card.style.transform = "translateX(0)", 180);
            }
        }
    </script>
</body>
</html>
